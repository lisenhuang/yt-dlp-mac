name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath ${{ runner.temp }}/ytdlmc.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create DMG
        run: |
          APP_PATH="${{ runner.temp }}/ytdlmc.xcarchive/Products/Applications/ytdlmc.app"
          DMG_PATH="${{ runner.temp }}/ytdlmc.dmg"
          STAGING="${{ runner.temp }}/dmg-staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/ytdlmc.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "ytdlmc" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          TITLE="Build $(date +%Y-%m-%d) (${GITHUB_SHA::7})"

          BODY=$(cat <<'EOF'
          Automated build from `main`.

          ### Install
          1. Download **ytdlmc.dmg** below
          2. Open the DMG and drag `ytdlmc.app` to Applications
          3. Make sure `yt-dlp` is installed (`brew install yt-dlp`)
          4. First launch: right-click the app → Open (required once for unsigned builds)
          EOF
          )

          gh release create "$TAG" \
            "${{ runner.temp }}/ytdlmc.dmg" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest
