name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath ${{ runner.temp }}/ytdlmc.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create DMG
        run: |
          APP_PATH="${{ runner.temp }}/ytdlmc.xcarchive/Products/Applications/yt-dlp-mac.app"
          DMG_PATH="${{ runner.temp }}/yt-dlp-mac.dmg"
          STAGING="${{ runner.temp }}/dmg-staging"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/yt-dlp-mac.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "yt-dlp-mac" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u '+%Y.%m.%d.%H%M')"
          TITLE="Build $(date -u '+%Y-%m-%d %H:%M') UTC (${GITHUB_SHA::7})"

          BODY="Automated build from \`main\`.

          ### Install
          1. Download **yt-dlp-mac.dmg** below
          2. Open the DMG and drag \`yt-dlp-mac.app\` to Applications
          3. First launch: macOS will block the app — go to **System Settings → Privacy & Security** and click **Open Anyway**
          4. yt-dlp is downloaded automatically on first launch — no manual install needed"

          gh release create "$TAG" \
            "${{ runner.temp }}/yt-dlp-mac.dmg" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest
