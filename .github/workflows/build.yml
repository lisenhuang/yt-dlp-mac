name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive
        run: |
          xcodebuild \
            -scheme ytdlmc \
            -configuration Release \
            -destination 'platform=macOS' \
            -archivePath ${{ runner.temp }}/ytdlmc.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Prepare release asset
        run: |
          cp -R "${{ runner.temp }}/ytdlmc.xcarchive/Products/Applications/ytdlmc.app" \
                "${{ runner.temp }}/ytdlmc.app"
          cd "${{ runner.temp }}"
          zip -r -y ytdlmc-mac.zip ytdlmc.app

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y.%m.%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          TITLE="Build $(date +%Y-%m-%d) (${GITHUB_SHA::7})"

          BODY=$(cat <<'EOF'
          Automated build from `main`.

          **Commit:** ${{ github.sha }}
          **Message:** ${{ github.event.head_commit.message }}

          ### Install
          1. Download `ytdlmc-mac.zip` below
          2. Unzip and drag `ytdlmc.app` to Applications
          3. Make sure `yt-dlp` is installed (`brew install yt-dlp`)

          > **Note:** This build is unsigned. On first launch, right-click → Open to bypass Gatekeeper.
          EOF
          )

          gh release create "$TAG" \
            "${{ runner.temp }}/ytdlmc-mac.zip" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest
